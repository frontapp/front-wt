name: Version Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check version was bumped
        run: |
          PR_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version in package.json ($PR_VERSION) was not bumped. Please run 'pnpm version patch|minor|major'."
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION -> $PR_VERSION"
